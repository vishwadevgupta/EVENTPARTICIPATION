<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in to SEP."><title>Sign in — SEP</title><link rel="stylesheet" href="signin.css"></head><body><main><a class="back" href="index.html">← Back to SEP</a><section class="panel"><div class="visual"><p>SEP / YOUR CAMPUS</p><h1>Ready to<br><span>show up?</span></h1><div class="mini-grid"><span>DISCOVER</span><span>REGISTER</span><span>PARTICIPATE</span></div></div><div class="form-area"><div><p class="eyebrow">MEMBER ACCESS</p><h2>Sign in</h2><p class="muted">Use your campus account to continue.</p><form id="signinForm"><label>Email<input id="email" type="email" placeholder="you@campus.edu" required></label><label>Password<input id="password" type="password" placeholder="••••••••" minlength="6" required></label><div class="form-row"><label class="check"><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div><button type="submit">Continue <span>→</span></button><p id="message" class="message" role="status"></p></form></div><p class="new">New here? <a href="services.html">Explore events first →</a></p></div></section></main><script>document.getElementById('signinForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('message').textContent='Demo sign-in validated. Connect this form to your authentication backend to enable real accounts.';});</script></body></html>
