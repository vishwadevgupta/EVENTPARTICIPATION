<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Participation — SEP</title><link rel="stylesheet" href="../css/dashboard.css"></head><body><header><a href="../index.html">SEP</a><div><span id="welcome"></span><a id="adminLink" class="admin-link" href="admin.html" hidden>Admin</a><button id="logout">Log out</button></div></header><main><section class="intro"><p>YOUR CAMPUS TRAIL</p><h1>My<br><em>participation.</em></h1><div class="stats"><div><strong id="count">0</strong><span>registrations</span></div><div><strong id="upcoming">0</strong><span>upcoming</span></div></div></section><section class="list"><div class="list-head"><h2>Registered events</h2><a href="services.html">Find another event →</a></div><div id="registrations"><p>Loading…</p></div></section></main><script src="../js/api.js"></script><script>
if(!getToken())location.href='Signin.html?next=dashboard.html';else{const u=getUser();document.getElementById('welcome').textContent='Hi, '+(u?.name||'student');if(u?.role==='admin')document.getElementById('adminLink').hidden=false;}
document.getElementById('logout').onclick=()=>{clearSession();location.href='index.html'};
async function load(){try{const rows=await api('/api/my/registrations');document.getElementById('count').textContent=rows.filter(x=>x.status!=='cancelled').length;document.getElementById('upcoming').textContent=rows.filter(x=>x.status==='registered'&&new Date(x.event_date)>new Date()).length;document.getElementById('registrations').innerHTML=rows.length?rows.map(x=>'<article class="row"><div><span class="status '+x.status+'">'+x.status+'</span><h3>'+x.title+'</h3><p>'+new Date(x.event_date).toLocaleString()+' · '+x.venue+'</p></div>'+(x.status==='registered'?'<button data-id="'+x.event_id+'">Cancel</button>':'')+'</article>').join(''):'<div class="empty">No registrations yet. <a href="services.html">Explore events →</a></div>';}catch(e){clearSession();location.href='Signin.html?next=dashboard.html'}}
document.getElementById('registrations').onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(confirm('Cancel this registration?')){await api('/api/events/'+b.dataset.id+'/register',{method:'DELETE'});load();}};load();
</script></body></html>
