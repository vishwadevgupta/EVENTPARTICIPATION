<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — SEP</title><link rel="stylesheet" href="../css/admin.css"></head><body><header><a href="../index.html">SEP / ADMIN</a><button id="logout">Log out</button></header><main><section class="hero"><p>CONTROL ROOM</p><h1>Run the<br><em>campus.</em></h1></section><section class="grid"><div class="panel"><p class="label">CREATE EVENT</p><h2>New event</h2><form id="eventForm"><input name="title" placeholder="Event title" required><select name="category"><option>tech</option><option>culture</option><option>sports</option></select><input name="venue" placeholder="Venue" required><input name="event_date" type="datetime-local" required><input name="capacity" type="number" min="1" value="100" required><textarea name="description" placeholder="Description" required></textarea><button>Create event →</button><p id="eventMessage"></p></form></div><div class="panel wide"><p class="label">REGISTRATIONS</p><h2>Latest activity</h2><div id="registrations">Loading…</div></div></section></main><script src="../js/api.js"></script><script>
if(!getToken()||getUser()?.role!=='admin')location.href='Signin.html?next=admin.html';
document.getElementById('logout').onclick=()=>{clearSession();location.href='index.html'};
async function load(){try{const rows=await api('/api/admin/registrations');document.getElementById('registrations').innerHTML=rows.length?rows.map(r=>'<div class="reg"><strong>'+r.name+'</strong><span>'+r.email+'</span><b>'+r.title+'</b><small>'+r.status+' · '+new Date(r.created_at).toLocaleString()+'</small></div>').join(''):'No registrations yet.';}catch(e){document.getElementById('registrations').textContent=e.message}}
document.getElementById('eventForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const body=Object.fromEntries(f.entries());try{await api('/api/events',{method:'POST',body:JSON.stringify(body)});document.getElementById('eventMessage').textContent='Event created successfully.';e.target.reset();load();}catch(err){document.getElementById('eventMessage').textContent=err.message}};load();
</script></body></html>
