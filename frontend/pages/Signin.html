<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in or create a SEP student account."><title>Sign in — SEP</title><link rel="stylesheet" href="../css/signin.css"></head><body><main><a class="back" href="../index.html">← Back to SEP</a><section class="panel"><div class="visual"><p>SEP / YOUR CAMPUS</p><h1>Ready to<br><span>show up?</span></h1><div class="mini-grid"><span>DISCOVER</span><span>REGISTER</span><span>PARTICIPATE</span></div></div><div class="form-area"><div><div class="tabs"><button class="tab active" data-mode="login">Sign in</button><button class="tab" data-mode="register">Create account</button></div><p class="muted" id="formIntro">Use your campus account to continue.</p><form id="authForm"><label id="nameField" class="hidden">Name<input id="name" type="text" placeholder="Your name"></label><label>Email<input id="email" type="email" placeholder="you@campus.edu" required></label><label>Password<input id="password" type="password" placeholder="At least 8 characters" minlength="8" required></label><button type="submit" id="submitButton">Continue <span>→</span></button><p id="message" class="message" role="status"></p></form></div><p class="new"><a href="services.html">← Explore events</a></p></div></section></main><script src="../js/api.js"></script><script>
const form=document.getElementById('authForm'),tabs=document.querySelectorAll('.tab'),nameField=document.getElementById('nameField'),intro=document.getElementById('formIntro'),submit=document.getElementById('submitButton'),message=document.getElementById('message');let mode='login';
tabs.forEach(t=>t.onclick=()=>{mode=t.dataset.mode;tabs.forEach(x=>x.classList.toggle('active',x===t));nameField.classList.toggle('hidden',mode==='login');document.getElementById('name').required=mode==='register';intro.textContent=mode==='login'?'Use your campus account to continue.':'Create your student account to register for events.';submit.innerHTML=mode==='login'?'Continue <span>→</span>':'Create account <span>→</span>';message.textContent='';});
form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='Working…';try{const body={email:email.value,password:password.value};if(mode==='register')body.name=name.value;const data=await api('/api/auth/'+(mode==='login'?'login':'register'),{method:'POST',body:JSON.stringify(body)});if(mode==='register'){message.textContent='Account created. You can now sign in.';tabs[0].click();}else{setSession(data);location.href=new URLSearchParams(location.search).get('next')||'dashboard.html';}}catch(err){message.textContent=err.message;}});
</script></body></html>
