<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Explore and register for student events on SEP."><title>Explore Events — SEP</title><link rel="stylesheet" href="../css/services.css"></head><body><header><a class="wordmark" href="../index.html">SEP<span>/ EVENTS</span></a><nav><a href="../index.html">Home</a><a class="active" href="services.html">Events</a><a href="about.html">About</a><a class="pill" id="accountLink" href="Signin.html">Sign in</a></nav></header><main><section class="intro"><p>DISCOVER / PARTICIPATE / REPEAT</p><h1>Find your<br><span>next thing.</span></h1><div class="filter-row"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="tech">Tech</button><button class="filter" data-filter="culture">Culture</button><button class="filter" data-filter="sports">Sports</button><input id="search" class="search" type="search" placeholder="Search events…"></div></section><section class="events" id="events"><p class="loading">Loading events…</p></section></main><script src="../js/api.js"></script><script>
const eventsEl=document.getElementById('events'),search=document.getElementById('search');let active='all';
function card(e){const date=new Date(e.event_date);const day=date.toLocaleDateString(undefined,{day:'2-digit'});const mon=date.toLocaleDateString(undefined,{month:'short'}).toUpperCase();const time=date.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});return '<article class="tile '+e.category+'"><div class="meta"><span>'+day+' '+mon+'</span><span>'+time+'</span></div><h2>'+e.title+'</h2><p>'+e.description+'</p><footer><span>'+e.venue+' · '+e.available+' spots left</span><button class="register" data-id="'+e.id+'">Register →</button></footer></article>'}
async function load(){eventsEl.innerHTML='<p class="loading">Loading events…</p>';try{const q=encodeURIComponent(search.value.trim());const data=await api('/api/events?category='+active+'&q='+q);eventsEl.innerHTML=data.length?data.map(card).join(''):'<p class="empty">No events match your search.</p>';}catch(e){eventsEl.innerHTML='<p class="empty">'+e.message+'</p>';}}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.filter;load()});search.addEventListener('input',()=>load());
eventsEl.addEventListener('click',async e=>{const b=e.target.closest('.register');if(!b)return;if(!getToken()){location.href='Signin.html?next=services.html';return}b.disabled=true;try{await api('/api/events/'+b.dataset.id+'/register',{method:'POST'});b.textContent='Registered ✓';}catch(err){if(err.message.includes('Authentication')){clearSession();location.href='Signin.html?next=services.html';}else{b.textContent=err.message;setTimeout(()=>b.textContent='Register →',1800);b.disabled=false;}}});
const user=getUser();if(user){const a=document.getElementById('accountLink');a.textContent='Dashboard ↗';a.href='dashboard.html';}
load();
</script></body></html>
